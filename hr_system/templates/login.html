<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 인사관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --navy:#0d1b2a; --navy2:#162236; --gold:#c9a84c; --gold-light:#e4c97e; }
body {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 50%, #1a2a40 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
}
.login-wrap { width: 100%; max-width: 460px; }
.login-card { background: #fff; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.35); overflow: hidden; }
.login-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  padding: 36px 32px 24px; text-align: center; border-bottom: 3px solid var(--gold);
}
.login-header .icon {
  width: 68px; height: 68px; background: rgba(201,168,76,.15); border: 2px solid var(--gold);
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.8rem; color: var(--gold-light); margin-bottom: 14px;
}
.login-header h1 { color: var(--gold-light); font-size: 1.3rem; font-weight: 700; font-family: 'Noto Serif KR', serif; margin: 0; }
.login-header p  { color: rgba(228,201,126,.65); font-size: .8rem; margin: 6px 0 0; }
.login-body { padding: 24px 32px 32px; }
.nav-tabs .nav-link { color: #666; font-size: .88rem; font-weight: 500; border-bottom: 2px solid transparent; }
.nav-tabs .nav-link.active { color: var(--navy); font-weight: 700; border-bottom: 2px solid var(--gold); background: transparent; }
.tab-content { padding-top: 20px; }
.form-label { font-size: .83rem; font-weight: 600; color: #444; }
.form-control, .form-select { border-radius: 8px; border: 1.5px solid #ddd; font-size: .9rem; }
.form-control:focus, .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.15); }
.btn-login {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 600;
  width: 100%; color: var(--gold-light);
}
.btn-login:hover { opacity: .88; color: var(--gold-light); }
.btn-register {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 700;
  width: 100%; color: var(--navy);
}
.btn-register:hover { opacity: .88; }
.hint-box { background: #f8f7f4; border: 1px solid #e2ddd6; border-radius: 8px; padding: 10px 14px; font-size: .78rem; color: #666; margin-top: 16px; }
.hint-box strong { color: var(--navy); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="icon"><i class="fa-solid fa-scale-balanced"></i></div>
      <h1>인사관리시스템</h1>
      <p>노무사 자문 전용 플랫폼</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="alert alert-danger py-2 mb-3 small">
        <i class="fa-solid fa-circle-exclamation me-1"></i>{{ messages[0] }}
      </div>
      {% endif %}
      {% endwith %}

      <ul class="nav nav-tabs" id="authTab">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">
            <i class="fa-solid fa-right-to-bracket me-1"></i>로그인
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">
            <i class="fa-solid fa-user-plus me-1"></i>회원가입
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- 로그인 -->
        <div class="tab-pane fade show active" id="loginTab">
          <form method="post" action="{{ url_for('login_page') }}">
            <div class="mb-3">
              <label class="form-label">아이디</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="fa-solid fa-user text-muted"></i>
                </span>
                <input type="text" name="username" class="form-control border-start-0"
                       placeholder="아이디를 입력하세요" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">비밀번호</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="fa-solid fa-lock text-muted"></i>
                </span>
                <input type="password" name="password" class="form-control border-start-0"
                       placeholder="비밀번호를 입력하세요" required>
              </div>
            </div>
            <button type="submit" class="btn btn-login">
              <i class="fa-solid fa-right-to-bracket me-2"></i>로그인
            </button>
          </form>
          <div class="hint-box">
            <i class="fa-solid fa-circle-info me-1"></i>
            최초 관리자: <strong>admin</strong> / <strong>admin1234</strong>
            <br><span style="font-size:.72rem;color:#999">로그인 후 반드시 비밀번호를 변경하세요.</span>
          </div>
        </div>

        <!-- 회원가입 -->
        <div class="tab-pane fade" id="registerTab">
          <form method="post" action="{{ url_for('register') }}">
            <div class="mb-3">
              <label class="form-label">아이디 <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" placeholder="영문+숫자 조합" required>
            </div>
            <div class="mb-3">
              <label class="form-label">이름</label>
              <input type="text" name="name" class="form-control" placeholder="실명">
            </div>
            <div class="mb-3">
              <label class="form-label">비밀번호 <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" placeholder="4자 이상" required minlength="4">
            </div>
            <div class="mb-3">
              <label class="form-label">역할 <span class="text-danger">*</span></label>
              <select name="role" class="form-select" id="regRole" onchange="onRoleChange()">
                <option value="company">기업담당자 (자문사)</option>
                <option value="employee">근로자 (직원)</option>
              </select>
              <div class="form-text" style="font-size:.73rem">관리자 계정은 직접 가입 불가.</div>
            </div>
            <div class="mb-3" id="regCoDiv">
              <label class="form-label">회사 <span class="text-danger">*</span></label>
              <select name="company_id" class="form-select" id="regCoSel" onchange="onCoChange()" required>
                <option value="">-- 회사를 선택하세요 --</option>
              </select>
            </div>
            <div class="mb-3 d-none" id="regEmpDiv">
              <label class="form-label">직원 연결 <span class="text-danger">*</span></label>
              <select name="employee_id" class="form-select" id="regEmpSel">
                <option value="">-- 먼저 회사를 선택하세요 --</option>
              </select>
              <div class="form-text" style="font-size:.73rem">본인의 직원 기록을 선택하세요.</div>
            </div>
            <button type="submit" class="btn btn-register mt-2">
              <i class="fa-solid fa-user-plus me-2"></i>계정 만들기
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch('/api/companies').then(r => r.json()).then(list => {
  const sel = document.getElementById('regCoSel');
  list.forEach(co => {
    const o = document.createElement('option');
    o.value = co.id; o.textContent = co.name;
    sel.appendChild(o);
  });
}).catch(() => {});

function onRoleChange() {
  const role = document.getElementById('regRole').value;
  const empDiv = document.getElementById('regEmpDiv');
  const empSel = document.getElementById('regEmpSel');
  if (role === 'employee') { empDiv.classList.remove('d-none'); empSel.required = true; }
  else { empDiv.classList.add('d-none'); empSel.required = false; }
}

function onCoChange() {
  const cid = document.getElementById('regCoSel').value;
  const empSel = document.getElementById('regEmpSel');
  if (!cid) return;
  empSel.innerHTML = '<option value="">로딩 중...</option>';
  fetch('/api/employees/' + cid).then(r => r.json()).then(list => {
    empSel.innerHTML = '<option value="">-- 직원 선택 --</option>';
    list.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id;
      o.textContent = e.name + (e.dept ? ' (' + e.dept + ')' : '') + (e.emp_no ? ' #' + e.emp_no : '');
      empSel.appendChild(o);
    });
  }).catch(() => {});
}
</script>
</body>
</html>

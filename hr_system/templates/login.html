<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 인사관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body { background: linear-gradient(135deg, #1e2a4a 0%, #2e3d6a 50%, #1e2a4a 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
.login-card { background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:100%; max-width:420px; overflow:hidden; }
.login-header { background: #1e2a4a; padding:36px 32px 28px; text-align:center; }
.login-header .icon { width:64px; height:64px; background:#4e73df; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; margin-bottom:14px; }
.login-header h1 { color:#fff; font-size:1.3rem; font-weight:700; margin:0; }
.login-header p { color:#b8c7e0; font-size:.82rem; margin:6px 0 0; }
.login-body { padding:32px; }
.form-label { font-size:.85rem; font-weight:600; color:#444; }
.form-control { border-radius:8px; border:1.5px solid #e3e6f0; padding:10px 14px; font-size:.92rem; transition:.2s; }
.form-control:focus { border-color:#4e73df; box-shadow:0 0 0 3px rgba(78,115,223,.15); }
.btn-login { background:#4e73df; border:none; border-radius:8px; padding:12px; font-size:1rem; font-weight:600; width:100%; color:#fff; transition:.2s; }
.btn-login:hover { background:#3a5fc8; color:#fff; }
.hint-box { background:#f8f9fc; border:1px solid #e3e6f0; border-radius:8px; padding:12px 16px; font-size:.8rem; color:#666; margin-top:16px; }
.hint-box strong { color:#4e73df; }
.alert { border-radius:8px; font-size:.88rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="icon"><i class="fa-solid fa-building-user"></i></div>
    <h1>인사관리시스템</h1>
    <p>노무사 자문 전용 플랫폼</p>
  </div>
  <div class="login-body">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login_page') }}">
      <div class="mb-3">
        <label class="form-label">아이디</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
          <input type="text" name="username" class="form-control border-start-0" placeholder="아이디를 입력하세요" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" name="password" class="form-control border-start-0" placeholder="비밀번호를 입력하세요" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="fa-solid fa-right-to-bracket me-2"></i>로그인
      </button>
    </form>

    <div class="hint-box mt-3">
      <i class="fa-solid fa-circle-info me-1"></i>
      최초 관리자 로그인: <strong>admin</strong> / <strong>admin1234</strong>
      <br><span class="text-muted" style="font-size:.75rem">로그인 후 반드시 비밀번호를 변경하세요.</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

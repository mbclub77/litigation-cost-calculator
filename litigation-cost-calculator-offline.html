<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소송비용액확정신청서 및 소송비용계산서 자동화</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif;font-size:14px;color:#333;background:#eef0f3;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
.app-header{background:#1b3a5e;color:#fff;padding:14px 24px;}
.app-header h1{font-size:19px;font-weight:700;letter-spacing:1px;}
.app-header p{font-size:12px;opacity:.7;margin-top:2px;}
.mode-bar{background:#fff;padding:12px 24px;border-bottom:2px solid #dde3ea;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mode-bar>label{font-weight:700;font-size:13px;color:#555;margin-right:4px;white-space:nowrap;}
.mbtn{padding:9px 20px;border:2px solid #ccd3db;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;background:#fff;color:#666;transition:all .18s;font-family:inherit;}
.mbtn:hover{border-color:#1b3a5e;color:#1b3a5e;}
.mbtn.m-win{background:#1b3a5e;color:#fff;border-color:#1b3a5e;}
.mbtn.m-partial{background:#d35400;color:#fff;border-color:#d35400;}
.mbtn.m-giveup{background:#6c757d;color:#fff;border-color:#6c757d;}
.mode-hint{margin-left:auto;font-size:12px;color:#888;background:#f4f6f8;padding:5px 10px;border-radius:6px;white-space:nowrap;}
.inst-tabs{background:#eceff3;padding:10px 24px;border-bottom:2px solid #dde3ea;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.inst-tabs>label{font-weight:700;font-size:13px;color:#555;margin-right:4px;white-space:nowrap;}
.itab{padding:7px 18px;border:2px solid #ccd3db;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:#fff;color:#555;font-family:inherit;transition:all .15s;}
.itab:hover{border-color:#1b3a5e;color:#1b3a5e;}
.itab.active{background:#1b3a5e;color:#fff;border-color:#1b3a5e;}
.itab-add{padding:7px 14px;border:2px dashed #aab4c0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:#5a7a9a;font-family:inherit;transition:all .15s;}
.itab-add:hover{border-color:#1b3a5e;color:#1b3a5e;background:#e8f0fb;}
.itab-del{padding:7px 12px;border:2px solid #e8d0d0;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;background:#fff7f7;color:#c0392b;font-family:inherit;}
.itab-del:hover{background:#c0392b;color:#fff;border-color:#c0392b;}
.layout{display:flex;height:calc(100vh - 150px);overflow:hidden;}
.inp{width:440px;min-width:400px;background:#f4f6f8;padding:16px;overflow-y:auto;border-right:1px solid #dde3ea;height:100%;box-sizing:border-box;}
.sec{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.sec-title{font-size:13px;font-weight:700;color:#1b3a5e;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid #e8f0fb;}
.sec-chk-title{display:flex;align-items:center;gap:8px;cursor:pointer;}
.sec-chk-title input[type=checkbox]{width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.sec-chk-title span{font-size:13px;font-weight:700;color:#1b3a5e;}
.sec-body{border-top:1px solid #e8f0fb;padding-top:10px;margin-top:8px;}
.fg{margin-bottom:9px;}
.fl{display:block;font-size:11px;color:#777;margin-bottom:3px;}
.fi{width:100%;padding:7px 9px;border:1px solid #d5dbe2;border-radius:6px;font-size:13px;font-family:inherit;color:#333;}
.fi:focus{outline:none;border-color:#1b3a5e;box-shadow:0 0 0 2px rgba(27,58,94,.1);}
.frow{display:flex;gap:8px;}
.frow .fg{flex:1;}
.btn{padding:7px 13px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;}
.btn-p{background:#1b3a5e;color:#fff;}
.btn-r{background:#c0392b;color:#fff;}
.btn-s{background:#7f8c8d;color:#fff;}
.btn-b{background:#2471a3;color:#fff;}
.btn-o{background:#e67e22;color:#fff;}
.qr-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.qr-btn{padding:5px 9px;background:#eaf1fb;color:#1b3a5e;border:1px solid #c0d3ea;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600;}
.qr-btn:hover{background:#1b3a5e;color:#fff;}
.trow{background:#f8f9fa;border-radius:6px;padding:8px;margin-bottom:8px;border:1px solid #e8edf2;}
.trow-main{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.trow input{padding:5px 7px;border:1px solid #d5dbe2;border-radius:5px;font-size:12px;font-family:inherit;}
.ti-loc{flex:1;min-width:60px;}
.ti-cost{width:80px;}
.ti-trips{width:46px;}
.cbadge{background:#e8f8ec;border:1px solid #a9dfbf;border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;}
.cbadge-row{display:flex;justify-content:space-between;color:#555;}
.cbadge-total{display:flex;justify-content:space-between;font-weight:700;color:#1e8449;font-size:13px;border-top:1px solid #a9dfbf;padding-top:5px;margin-top:4px;}
.ratio-row{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;}
.ratio-row input{width:58px;text-align:center;padding:6px;border:1px solid #d5dbe2;border-radius:5px;font-size:14px;font-family:inherit;}
.ratio-pct{font-weight:700;color:#d35400;}
.total-box{background:#e8f0fb;border:2px solid #1b3a5e;border-radius:8px;padding:12px;text-align:right;}
.total-box .big{font-size:22px;font-weight:700;color:#1b3a5e;}
.ib{display:inline-block;background:#2471a3;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:5px;font-weight:400;}
.party-toggle{display:flex;gap:0;margin-bottom:12px;border:2px solid #1b3a5e;border-radius:8px;overflow:hidden;}
.party-tab{flex:1;padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;background:#fff;color:#555;font-family:inherit;border:none;}
.party-tab.active{background:#1b3a5e;color:#fff;}
.doc-panel{flex:1;background:#d8dce0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;height:100%;}
.doc-toolbar{background:#e0e4e8;padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px solid #c8cdd2;width:100%;}
.tbtn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;background:#1b3a5e;color:#fff;}
.tbtn:hover{opacity:.85;}
.tbtn-sec{background:#fff;color:#1b3a5e;border:1.5px solid #1b3a5e;}
.tbtn-sec:hover{background:#1b3a5e;color:#fff;}
.tsep{color:#bbb;font-size:18px;padding:0 4px;}
.doc-screen-area{width:100%;display:flex;justify-content:center;padding:24px;}
.doc-wrap{background:#fff;width:210mm;min-height:297mm;padding:18mm 22mm;box-shadow:0 4px 20px rgba(0,0,0,.2);resize:both;overflow:auto;}
.resp-bar{background:#e8f4e8;padding:10px 24px;border-bottom:2px solid #a8d5a8;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.resp-bar>label{font-weight:700;font-size:13px;color:#2e6b2e;margin-right:4px;white-space:nowrap;}
.rtab{padding:7px 16px;border:2px solid #a8d5a8;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:#fff;color:#2e6b2e;font-family:inherit;transition:all .15s;}
.rtab:hover{border-color:#2e6b2e;}
.rtab.active{background:#2e6b2e;color:#fff;border-color:#2e6b2e;}
.rtab-add{padding:7px 12px;border:2px dashed #7ab87a;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:#2e6b2e;font-family:inherit;}
.rtab-add:hover{background:#c8eac8;}
.rtab-del{padding:7px 10px;border:2px solid #e8d0d0;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;background:#fff7f7;color:#c0392b;font-family:inherit;}
.rtab-del:hover{background:#c0392b;color:#fff;}
/* 수정 2: 테이블 색상 완화 */
.ctbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0;}
.ctbl th{background:#4a6fa5;color:#fff;padding:7px 8px;text-align:center;border:1px solid #4a6fa5;font-size:12px;}
.ctbl td{padding:5px 8px;border:1px solid #ccc;vertical-align:middle;}
.ctbl .num{text-align:center;width:28px;}
.ctbl .amt{text-align:right;font-family:'Courier New',monospace;white-space:nowrap;}
.ctbl tr.even{background:#fafafa;}
.ctbl tr.sub{background:#eef2f7;font-weight:700;}
.ctbl tr.sub td{border:1px solid #7a9cc8;}
.ctbl tr.ttl{background:#4a6fa5;color:#fff;font-weight:700;font-size:13px;}
.ctbl tr.ttl td{border:1px solid #7a9cc8;}
/* wctbl margin-top 조정 */
.wctbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:0.5em;}
.wctbl th{background:#4a6fa5;color:#fff;padding:7px 8px;text-align:center;border:1px solid #4a6fa5;font-size:11.5px;}
.wctbl td{padding:6px 8px;border:1px solid #ccc;vertical-align:middle;}
.wctbl .amt{text-align:right;font-family:'Courier New',monospace;white-space:nowrap;}
.wctbl .ctr{text-align:center;}
.wctbl .rgt{text-align:right;padding-right:10px;}
.wctbl tr.wsub{background:#eef2f7;font-weight:700;}
.wctbl tr.wsub td{border:1px solid #7a9cc8;}
.wctbl tr.wttl{background:#4a6fa5;color:#fff;font-weight:700;}
.wctbl tr.wttl td{border:1px solid #7a9cc8;}
.doc-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:5px;margin-bottom:8px;}
.doc-sub{text-align:center;font-size:13px;color:#555;margin-bottom:18px;}
.doc-sec-label{font-size:13px;font-weight:700;color:#1b3a5e;padding:4px 8px;background:#eef2f7;border-left:4px solid #1b3a5e;}
.reimb{margin-top:16px;padding:14px;background:#fff8f0;border:2.5px solid #d35400;border-radius:6px;}
.reimb-title{font-weight:700;font-size:13px;color:#d35400;margin-bottom:8px;}
.reimb-formula{font-size:11.5px;color:#666;margin:3px 0;}
.reimb-big{font-size:20px;font-weight:700;color:#d35400;text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed #d35400;}
.fn{margin-top:20px;padding-top:10px;border-top:1.5px solid #999;font-size:10.5px;color:#555;line-height:1.9;min-height:60px;}
.fn p{margin:2px 0;}
.abn-note{margin-top:18px;font-size:13px;line-height:1.9;}
.pet-title-h1{text-align:center;font-size:24px;font-weight:700;margin-bottom:18px;}
.pet-hbox{margin-bottom:24px;font-size:13.5px;line-height:2.4;}
.pet-hrow{display:flex;gap:0;}
.pet-hlbl{min-width:6em;font-weight:700;display:inline-block;}
.pet-sec{text-align:center;font-size:16px;font-weight:700;letter-spacing:8px;margin:3em 0 1em;}
.pet-para{line-height:2.1;font-size:13px;margin:0 0 0;text-indent:1em;}
.pet-item{font-size:13px;line-height:1.9;margin:2px 0;}
.pet-sign{text-align:right;font-size:13px;line-height:2.4;margin-bottom:36px;}
.pet-court{font-size:20px;font-weight:700;}
[contenteditable]:focus{outline:1px dashed #aaa;border-radius:2px;}
.print-all-docs{display:none;}
@media print{
  body{background:#fff;}
  .app-header,.mode-bar,.inst-tabs,.inp,.doc-toolbar,.resp-bar{display:none!important;}
  .layout{display:block;}
  .doc-panel{background:#fff;display:block;padding:0;}
  .doc-screen-area{display:none!important;}
  .print-all-docs{display:block!important;}
  .print-doc-wrap .doc-wrap{box-shadow:none;width:100%;padding:12mm 18mm;min-height:auto;page-break-after:always;}
  body[data-print="calc"] .petition-print-area{display:none!important;}
  body[data-print="petition"] .calc-print-area{display:none!important;}
  body:not([data-print="abandon"]) .abandon-print-area{display:none!important;}
  body[data-print="abandon"] .calc-print-area{display:none!important;}
  body[data-print="abandon"] .petition-print-area{display:none!important;}
  @page{size:A4 portrait;margin:0;}
  .ctbl th,.wctbl th{background:#4a6fa5!important;color:#fff!important;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .ctbl tr.ttl td,.wctbl tr.ttl td{background:#4a6fa5!important;color:#fff!important;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .ctbl tr.sub td,.wctbl tr.sub td{background:#eef2f7!important;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .ctbl tr.even td,.wctbl tr.even td{background:#fafafa!important;print-color-adjust:exact;-webkit-print-color-adjust:exact;}
}
@media(max-width:900px){
  .layout{flex-direction:column;}
  .inp{width:100%;min-width:0;}
  .doc-wrap{width:100%;}
}
</style>

<script>
/** @jsxRuntime classic */
const {
  useState
} = React;

/* ── 상수 ── */
const MEAL = 25000;
const ATTENDANCE = 50000;
const SEC_RATE = 250;

/* 수정 7: 변호사보수 요율표 */
const ATTORNEY_FEE_TIERS = [{
  max: 20000000,
  base: 0,
  exBase: 0,
  rate: 0.10
}, {
  max: 50000000,
  base: 2000000,
  exBase: 20000000,
  rate: 0.08
}, {
  max: 100000000,
  base: 4400000,
  exBase: 50000000,
  rate: 0.06
}, {
  max: 150000000,
  base: 7400000,
  exBase: 100000000,
  rate: 0.04
}, {
  max: 200000000,
  base: 9400000,
  exBase: 150000000,
  rate: 0.02
}, {
  max: 500000000,
  base: 10400000,
  exBase: 200000000,
  rate: 0.01
}, {
  max: Infinity,
  base: 13400000,
  exBase: 500000000,
  rate: 0.005
}];
// 출처: 변호사보수의 소송비용 산입에 관한 규칙 제3조

const QUICK_ROUTES = [{
  label: '수원역↔수원지법',
  dep: '수원역',
  dest: '수원지방법원',
  fare: 1400
}, {
  label: '수원역↔서울행정법원',
  dep: '수원역',
  dest: '서울행정법원',
  fare: 9500
}, {
  label: '수원역↔서울중앙지법',
  dep: '수원역',
  dest: '서울중앙지방법원',
  fare: 9500
}];

/* 수정 9: 5심까지 확장 */
const INSTANCE_LABELS = ['1심', '2심', '3심', '4심(파기환송심)', '5심'];
const SUB_LABELS = ['A', 'B', 'C', 'D', 'E'];

/* ── 헬퍼 ── */
const N = s => parseInt((s + '').replace(/[^0-9]/g, '')) || 0;
const fmt = n => {
  if (!n && n !== 0) return '-';
  const r = Math.round(n);
  return r === 0 ? '-' : r.toLocaleString('ko-KR') + '원';
};
const feeCalc = soga => {
  if (!soga || soga <= 0) return 0;
  for (const t of ATTORNEY_FEE_TIERS) if (soga <= t.max) return t.base + (soga - t.exBase) * t.rate;
  return 0;
};
const naverUrl = dest => `https://map.naver.com/p/search/${encodeURIComponent(dest || '법원')}`;
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
};
const getAmt = (ov, auto) => ov !== '' ? N(ov) : auto;
const getTxt = (ov, auto) => ov !== '' ? ov : auto;

/* ── 자동값 ── */
const autoAttendAmt = inst => N(inst.attendCnt) * ATTENDANCE;
const autoMealAmt = inst => N(inst.mealCnt) * MEAL;
const autoTravelAmt = t => N(t.fare) * 2 * (parseInt(t.trips) || 1);
const autoAttyApplied = inst => {
  const calc = feeCalc(N(inst.attySoga));
  const actual = N(inst.attyActual);
  return actual > 0 ? Math.min(calc, actual) : calc;
};
const autoSecAmt = inst => N(inst.sec.total_pages) * SEC_RATE;

/* ── 항목 목록 생성 (정규화된 inst 받음) ── */
const getInstItems = inst => {
  const items = [];
  if (inst.attendEnabled) {
    const autoAmt = autoAttendAmt(inst);
    const amt = getAmt(inst.attendAmt, autoAmt);
    items.push({
      key: 'attend',
      amount: amt,
      note: getTxt(inst.attendNote, `1회당¹⁾\n50,000원`),
      desc: `변론기일 ${N(inst.attendCnt)}회 참석 일당\n(50,000원 × ${N(inst.attendCnt)}회 = ${amt.toLocaleString()}원)`
    });
  }
  if (inst.mealEnabled) {
    const autoAmt = autoMealAmt(inst);
    const amt = getAmt(inst.mealAmt, autoAmt);
    items.push({
      key: 'meal',
      amount: amt,
      note: getTxt(inst.mealNote, `1일²⁾\n25,000원³⁾`),
      desc: `식대\n(25,000원 × ${N(inst.mealCnt)}회 = ${amt.toLocaleString()}원)`
    });
  }
  (inst.travels || []).forEach((t, ti) => {
    if (t.enabled !== false) {
      const autoAmt = autoTravelAmt(t);
      const amt = getAmt(t.amt, autoAmt);
      items.push({
        key: `t${ti}`,
        amount: amt,
        note: getTxt(t.note, `1회당⁴⁾ (편도)\n편도 ${N(t.fare).toLocaleString()}원`),
        desc: `왕복 여비(${t.dep || '　'} – ${t.dest || '　'})\n(${N(t.fare).toLocaleString()}원 × ${t.trips || 1}회 × 2 = ${amt.toLocaleString()}원)`
      });
    }
  });
  if (inst.attyEnabled) {
    const autoAmt = autoAttyApplied(inst);
    const amt = getAmt(inst.attyAmt, autoAmt);
    items.push({
      key: 'atty',
      amount: amt,
      note: getTxt(inst.attyNote, `변호사\n보수⁷⁾`),
      desc: `변호사 보수\n(적용 보수액 = ${amt.toLocaleString()}원)`
    });
  }
  if (inst.secEnabled) {
    const autoAmt = autoSecAmt(inst);
    const amt = getAmt(inst.secAmt, autoAmt);
    items.push({
      key: 'sec',
      amount: amt,
      note: getTxt(inst.secNote, `장당\n250원`),
      desc: `서기료${inst.sec_desc ? `(${inst.sec_desc})` : ''}\n(총 ${N(inst.sec.total_pages)}장 × 250원 = ${amt.toLocaleString()}원)`
    });
  }
  /* 본안 소송비용: 서기료 다음 */
  if (inst.bonStampEnabled) {
    const stamp = N(inst.bonStamp);
    const post = N(inst.bonPost);
    const refund = N(inst.bonRefund);
    if (stamp > 0) items.push({
      key: 'bonStamp',
      amount: stamp,
      note: '인지액',
      desc: `인지액\n(${stamp.toLocaleString()}원)`
    });
    if (post > 0) items.push({
      key: 'bonPost',
      amount: post,
      note: '송달료',
      desc: `송달료\n(${post.toLocaleString()}원)`
    });
    if (refund > 0) items.push({
      key: 'bonRefund',
      amount: -refund,
      note: '환급액',
      desc: `환급액\n(-${refund.toLocaleString()}원)`
    });
  }
  /* 기타비용: 본안소송비용 다음 */
  const otherAmt = inst.otherEnabled ? N(inst.otherAmt || inst.other) : N(inst.other);
  if ((inst.otherEnabled || !('otherEnabled' in inst)) && otherAmt > 0) {
    items.push({
      key: 'other',
      amount: otherAmt,
      note: inst.otherNote || '',
      desc: '기타비용'
    });
  }
  return items;
};

/* ── 승소 인스턴스 ── */
const defaultWinInst = label => ({
  label,
  num: '',
  court: '',
  attendEnabled: true,
  attendCnt: '',
  attendAmt: '',
  attendNote: '',
  mealEnabled: true,
  mealCnt: '',
  mealAmt: '',
  mealNote: '',
  travels: [],
  attyEnabled: false,
  attySoga: '',
  attyActual: '',
  attyAmt: '',
  attyNote: '',
  secEnabled: true,
  sec: {
    total_pages: ''
  },
  sec_desc: '',
  secAmt: '',
  secNote: '',
  otherEnabled: false,
  other: '',
  bonStampEnabled: false,
  bonStamp: '',
  bonPost: '',
  bonRefund: '',
  confEnabled: true
});
const computeWinInst = inst => {
  const items = getInstItems(inst);
  const otherN = N(inst.other);
  const subtotal = items.reduce((s, i) => s + i.amount, 0) + otherN;
  const byKey = {};
  items.forEach(i => {
    const k = i.key.startsWith('t') ? 'travel' : i.key;
    byKey[k] = (byKey[k] || 0) + i.amount;
  });
  return {
    attendTotal: byKey.attend || 0,
    mealTotal: byKey.meal || 0,
    travelTotal: byKey.travel || 0,
    attyTotal: byKey.atty || 0,
    secTotal: byKey.sec || 0,
    otherN,
    subtotal,
    grand: subtotal,
    stampN: 0,
    postN: 0,
    appliedFee: byKey.atty || 0
  };
};

/* ── 일부승소 인스턴스 ── */
const mkParty = () => ({
  attendEnabled: true,
  attendCnt: '',
  attendAmt: '',
  attendNote: '',
  mealEnabled: true,
  mealCnt: '',
  mealAmt: '',
  mealNote: '',
  travels: [],
  attyEnabled: false,
  attySoga: '',
  attyActual: '',
  attyAmt: '',
  attyNote: '',
  secEnabled: true,
  sec: {
    total_pages: ''
  },
  sec_desc: '',
  secAmt: '',
  secNote: '',
  otherEnabled: false,
  otherAmt: '',
  otherNote: '',
  confEnabled: false,
  confStamp: '',
  confPost: '',
  bonStampEnabled: false,
  bonStamp: '',
  bonPost: '',
  bonRefund: ''
});
const defaultPartialInst = label => ({
  label,
  num: '',
  court: '',
  pRatioNum: '7',
  pRatioDen: '10',
  p: mkParty(),
  d: mkParty()
});
/* 정규화: partial inst의 party 데이터를 getInstItems가 받을 수 있는 형태로 변환 */
const toWinView = (pi, party) => ({
  label: pi.label,
  num: pi.num,
  court: pi.court,
  attendEnabled: pi[party].attendEnabled,
  attendCnt: pi[party].attendCnt,
  attendAmt: pi[party].attendAmt,
  attendNote: pi[party].attendNote,
  mealEnabled: pi[party].mealEnabled,
  mealCnt: pi[party].mealCnt,
  mealAmt: pi[party].mealAmt,
  mealNote: pi[party].mealNote,
  travels: pi[party].travels,
  attyEnabled: pi[party].attyEnabled,
  attySoga: pi[party].attySoga,
  attyActual: pi[party].attyActual,
  attyAmt: pi[party].attyAmt,
  attyNote: pi[party].attyNote,
  secEnabled: pi[party].secEnabled,
  sec: pi[party].sec,
  sec_desc: pi[party].sec_desc,
  secAmt: pi[party].secAmt,
  secNote: pi[party].secNote,
  otherEnabled: pi[party].otherEnabled,
  otherAmt: pi[party].otherAmt,
  otherNote: pi[party].otherNote,
  confEnabled: pi[party].confEnabled,
  confStamp: pi[party].confStamp,
  confPost: pi[party].confPost,
  bonStampEnabled: pi[party].bonStampEnabled,
  bonStamp: pi[party].bonStamp,
  bonPost: pi[party].bonPost,
  bonRefund: pi[party].bonRefund
});

/* ── 포기 인스턴스 ── */
const defaultAbandonInst = label => ({
  label,
  court: '',
  caseNum: '',
  caseTitle: '',
  stampAmt: '',
  postageAmt: '',
  refundAmt: '',
